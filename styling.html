<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Perfect Look | AURA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">AURA</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="styling.html">Discover</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main class="styling-page">

        <div class="styling-intro">

            <p class="small-title">
                AURA • YOUR PERSONAL AI STYLIST
            </p>

            <h1>
                Let's create<br>
                <span>your perfect look.</span>
            </h1>

            <p class="description">
                Tell us a little about your style and we'll
                create a look that feels uniquely yours.
            </p>

        </div>

        <div class="style-form">

            <div class="question">
                <p class="question-number">01</p>
                <h2>What's the occasion?</h2>

                <div class="options">
                    <button>College</button>
                    <button>Casual</button>
                    <button>Party</button>
                    <button>Wedding</button>
                </div>
            </div>

            <div class="question">
                <p class="question-number">02</p>
                <h2>What's your style vibe?</h2>

                <div class="options">
                    <button>Classic</button>
                    <button>Minimal</button>
                    <button>Trendy</button>
                    <button>Traditional</button>
                </div>
            </div>

            <div class="question">
                <p class="question-number">03</p>
                <h2>What colours do you love?</h2>

                <div class="options">
                    <button>Neutrals</button>
                    <button>Pastels</button>
                    <button>Bold</button>
                    <button>Earthy</button>
                </div>
            </div>

            <div class="question">
                <p class="question-number">04</p>
                <h2>Choose your season</h2>

                <div class="options">
                    <button>Summer</button>
                    <button>Monsoon</button>
                    <button>Winter</button>
                    <button>Spring</button>
                </div>
            </div>

            <button class="generate-button" onclick="generateLook()">
                Generate My Look →
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
